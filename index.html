<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="image/cle.svg" type="image/svg">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-box">
        <div class="box">
            <div class="container-div1">
                <div class="div1">
                    <div class="container-div2">
                        <div class="div2">
                            <h4 id="eden">EDEN school</h4>
                            <h1>générateur de <br> mots de passe</h1>
                            <div class="clé">
                               <div class="barre-clé">
                                 <img class="img-clé" src="image/cle.svg" alt="" srcset="">

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container-password">
                <div class="password">
                    <h4 id="text-password">mots de passe</h4>
                    <p>16 caractère</p>
                </div>
            </div>
            <div class="container-input">
                <input id="input-password" name="password-input" class="input" type="text" placeholder="attente du clic">
            </div>
            <div class="container-click">
                <div class="carré-click">
                    <button class="btn-click"><click>copier</click></button>
                </div>
            </div>
            <div class="container-lance">
                <button id="button-lance" class="btn-lance"><lance>générer un mots de passe</lance></button>
            </div>
        </div>
    </div>
    
</body>
<script>
    const textes = [
        "LOh345HDJ.",
        "kHsY45sd6.",
        "wxVJ78sdE.",
        "kFD780LKM.",
    ]

    const button = document.getElementById("button-lance");
    const input = document.getElementById("input-password");

    button.addEventListener("click", () => {
       const indexAleatoire = Math.floor(Math.random() * textes.length);
       input.value = textes[indexAleatoire];

    });

    const buttonClick = document.querySelector(".btn-click");

    buttonClick.addEventListener("click",() => {
        navigator.clipboard.writeText(input.value);
       buttonClick.textContent= "copié";
        

    });

   
    
   
</script>
</html>
